<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cpeasy</title>
    <style>
        body {
            width: 280px;
            margin: 0;
            background: #111315;
            color: #f4f7fb;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .popup {
            padding: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: #e8f0ff;
            color: #1f5bd8;
            font-weight: 900;
            font-size: 13px;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            line-height: 1.2;
        }

        p {
            margin: 4px 0 0;
            color: #9aa6b2;
            font-size: 12px;
            line-height: 1.45;
        }

        .panel {
            border: 1px solid #2c3442;
            border-radius: 8px;
            background: #171a1f;
            padding: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #dbe7ff;
            font-weight: 750;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #27c46a;
            box-shadow: 0 0 0 4px rgba(39, 196, 106, 0.13);
        }

        .hint {
            margin-top: 10px;
            color: #9aa6b2;
            font-size: 12px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <main class="popup">
        <div class="brand">
            <div class="logo">cp</div>
            <div>
                <h1>cpeasy IDE</h1>
                <p>Codeforces sample runner</p>
            </div>
        </div>
        <section class="panel">
            <div class="status"><span class="dot"></span><span>Ready on Codeforces problem pages</span></div>
            <div class="hint">Open a problem and click the cpeasy IDE button beside the title.</div>
        </section>
    </main>
</body>
</html>
